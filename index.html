<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-red-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <div class="font-black text-xl tracking-tighter">DUNAS STUDIO</div>
        <div class="flex gap-4 font-bold text-sm">
            <button onclick="showTab('ventas')">VENTAS</button>
            <button onclick="showTab('clientes')">CLIENTES</button>
            <button onclick="showTab('modelos')">MODELOS</button>
        </div>
    </nav>

    <main id="ventas" class="tab-content p-4 max-w-5xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <h2 class="text-xl font-bold mb-6 text-slate-800">Nueva Nota de Venta</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Cliente</label>
                    <select id="v_cliente" class="w-full border-2 p-3 rounded-xl focus:border-red-500 outline-none"></select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Modelo base</label>
                    <div class="flex gap-2">
                        <select id="v_modelo_sel" class="flex-1 border-2 p-3 rounded-xl focus:border-red-500 outline-none"></select>
                        <button onclick="addItem()" class="bg-blue-600 text-white px-6 rounded-xl font-bold hover:bg-blue-700">+ Añadir</button>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full border-separate border-spacing-y-2">
                    <thead>
                        <tr class="text-slate-400 text-xs uppercase text-left">
                            <th class="px-4">Modelo / Descripción</th>
                            <th class="px-4 w-24 text-center">Cant.</th>
                            <th class="px-4 w-32 text-right">Precio</th>
                            <th class="px-4 w-32 text-right">Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="v_tabla"></tbody>
                </table>
            </div>

            <div class="flex flex-col items-end mt-8 border-t pt-6">
                <div class="text-4xl font-black text-red-900 mb-6">Total: $<span id="v_total">0.00</span></div>
                <button onclick="processSale()" id="btn_sale" class="bg-red-800 text-white px-12 py-4 rounded-2xl font-black text-lg hover:scale-105 transition shadow-xl w-full md:w-auto">
                    GENERAR PDF Y GUARDAR
                </button>
            </div>
        </div>
    </main>

    <section id="clientes" class="tab-content hidden p-4 max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Clientes Registrados</h2>
            <button onclick="openModal('c')" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">+ Nuevo</button>
        </div>
        <div id="list_clientes" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <section id="modelos" class="tab-content hidden p-4 max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Catálogo de Modelos</h2>
            <button onclick="openModal('m')" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">+ Nuevo</button>
        </div>
        <div id="list_modelos" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx8zhRhT578V1D94Gba6mkVw2Sa370_wgbHUJmQrGPtQfpFDO9SaigQy5W4DCS_-yAUzQ/exec";
        let db = { clientes: [], modelos: [] };
        let cart = [];

        async function load() {
            const res = await fetch(API);
            db = await res.json();
            renderUI();
        }

        function renderUI() {
            document.getElementById('v_cliente').innerHTML = db.clientes.map(c => `<option value="${c.nombre}">${c.nombre} (${c.destino})</option>`).join('');
            document.getElementById('v_modelo_sel').innerHTML = db.modelos.map((m,i) => `<option value="${i}">${m.nombre}</option>`).join('');
            
            document.getElementById('list_clientes').innerHTML = db.clientes.map(c => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
                    <div><p class="font-bold text-red-900">${c.nombre}</p><p class="text-xs text-slate-400">${c.destino} | ${c.tel}</p></div>
                    <button onclick="del('Clientes', ${c.index})" class="text-red-300 hover:text-red-600 font-bold">Eliminar</button>
                </div>`).join('');
            
            document.getElementById('list_modelos').innerHTML = db.modelos.map(m => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
                    <p class="font-bold text-slate-700">${m.nombre}</p>
                    <button onclick="del('Modelos', ${m.index})" class="text-red-300 hover:text-red-600 font-bold">Eliminar</button>
                </div>`).join('');
        }

        function addItem() {
            const sel = document.getElementById('v_modelo_sel');
            const m = db.modelos[sel.value];
            cart.push({ modelo: m.nombre, descripcion: '', precio: 0, cantidad: 1, subtotal: 0 });
            renderCart();
        }

        function updateCart(i, field, val) {
            cart[i][field] = (field === 'descripcion') ? val : parseFloat(val || 0);
            cart[i].subtotal = cart[i].cantidad * cart[i].precio;
            renderCart();
        }

        function renderCart() {
            let total = 0;
            document.getElementById('v_tabla').innerHTML = cart.map((it, i) => {
                total += it.subtotal;
                return `
                <tr class="bg-white shadow-sm">
                    <td class="p-4 rounded-l-xl border-y border-l">
                        <div class="font-bold text-slate-800">${it.modelo}</div>
                        <input type="text" placeholder="Añadir descripción..." value="${it.descripcion}" onchange="updateCart(${i}, 'descripcion', this.value)" class="text-xs w-full mt-1 text-blue-600 outline-none">
                    </td>
                    <td class="p-4 border-y text-center">
                        <input type="number" value="${it.cantidad}" onchange="updateCart(${i}, 'cantidad', this.value)" class="w-16 text-center border rounded font-bold">
                    </td>
                    <td class="p-4 border-y text-right">
                        <input type="number" value="${it.precio}" onchange="updateCart(${i}, 'precio', this.value)" class="w-24 text-right border rounded font-bold">
                    </td>
                    <td class="p-4 border-y text-right font-black text-slate-700">$${it.subtotal.toFixed(2)}</td>
                    <td class="p-4 rounded-r-xl border-y border-r text-center">
                        <button onclick="cart.splice(${i},1); renderCart();" class="text-red-500 font-bold">✕</button>
                    </td>
                </tr>`;
            }).join('');
            document.getElementById('v_total').innerText = total.toFixed(2);
        }

        async function processSale() {
            if(cart.length === 0) return alert("Añade modelos a la nota.");
            const btn = document.getElementById('btn_sale');
            btn.disabled = true; btn.innerText = "PROCESANDO...";
            
            const payload = {
                cliente: document.getElementById('v_cliente').value,
                items: cart,
                total: document.getElementById('v_total').innerText
            };

            const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'createSale', payload }) });
            const data = await res.json();
            if(data.status === "success") {
                window.open(data.url, '_blank');
                cart = []; renderCart();
                alert("¡Venta Guardada! Pedido No: " + data.pedido);
            }
            btn.disabled = false; btn.innerText = "GENERAR PDF Y GUARDAR";
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function del(sheet, index) {
            if(!confirm("¿Eliminar registro?")) return;
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'delete', payload: { sheet, index } }) });
            load();
        }

        async function openModal(type) {
            if(type === 'c') {
                const nombre = prompt("Nombre del Cliente:");
                const destino = prompt("Destino (Ciudad):");
                const tel = prompt("Teléfono:");
                if(nombre) await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'upsertCliente', payload: { nombre, destino, tel } }) });
            } else {
                const nombre = prompt("Nombre del Modelo:");
                if(nombre) await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'upsertModelo', payload: { nombre } }) });
            }
            load();
        }

        load();
    </script>
</body>
</html>
