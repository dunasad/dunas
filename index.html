<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0d6efd; --sidebar-width: 250px; }
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; margin: 0; }
        #login-screen { position: fixed; inset: 0; background: #f8f9fa; z-index: 10001; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 380px; padding: 2.5rem; border-radius: 1.5rem; background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .wrapper { display: flex; width: 100%; align-items: stretch; }
        #sidebar { min-width: var(--sidebar-width); max-width: var(--sidebar-width); background: #212529; color: #fff; transition: all 0.3s; min-height: 100vh; }
        #sidebar.active { margin-left: calc(-1 * var(--sidebar-width)); }
        #sidebar .sidebar-header { padding: 20px; text-align: center; background: #1a1d20; }
        #sidebar ul li a { padding: 15px 20px; display: block; color: #adb5bd; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        #sidebar ul li.active > a, #sidebar ul li a:hover { color: #fff; background: var(--primary); }
        #content { width: 100%; min-height: 100vh; }
        .app-section { padding: 20px; }
        .d-none { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card text-center">
            <img src="logo.png" alt="DUNAS" width="120" class="mb-4 mx-auto d-block">
            <h5 class="fw-bold mb-4">Acceso DUNAS</h5>
            <input type="text" id="userInput" class="form-control mb-3 text-center rounded-3" placeholder="Usuario">
            <input type="password" id="passInput" class="form-control mb-4 text-center rounded-3" placeholder="Contraseña">
            <button class="btn btn-primary w-100 py-2 fw-bold rounded-pill" id="btnLogin" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <div class="wrapper d-none" id="main-app">
        <nav id="sidebar">
            <div class="sidebar-header"><img src="logo.png" width="100" style="filter: brightness(0) invert(1);"></div>
            <ul class="list-unstyled components">
                <li id="menu-notas" class="active" onclick="showSection('notas')"><a href="#"><i class="bi bi-file-earmark-plus"></i> Notas</a></li>
                <li id="menu-historial" onclick="showSection('historial')"><a href="#"><i class="bi bi-clock-history"></i> Historial</a></li>
                <li id="menu-clientes" onclick="showSection('clientes')"><a href="#"><i class="bi bi-people"></i> Clientes</a></li>
                <li id="menu-modelos" onclick="showSection('modelos')"><a href="#"><i class="bi bi-box-seam"></i> Modelos</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-light bg-white shadow-sm px-4 py-3 mb-4">
                <button type="button" onclick="document.getElementById('sidebar').classList.toggle('active')" class="btn btn-outline-primary border-0"><i class="bi bi-list fs-4"></i></button>
                <h5 class="mb-0 fw-bold text-secondary" id="sectionTitle">Crear Nota</h5>
            </nav>

            <div class="container-fluid">
                <div id="sec-notas" class="app-section">
                    <div class="card border-0 shadow-sm p-4 rounded-4">
                        <label class="small fw-bold text-muted mb-2">CLIENTE</label>
                        <select id="selCliente" class="form-select mb-4 border-0 bg-light py-2"></select>
                        <div id="itemsContainer"></div>
                        <button class="btn btn-outline-primary btn-sm w-100 mb-4 py-2 border-dashed" onclick="addItem()">+ Agregar Concepto</button>
                        <div class="d-flex justify-content-between align-items-center border-top pt-4">
                            <div><span class="text-muted small">Total</span><h3 class="fw-bold mb-0 text-primary">$<span id="totalTxt">0.00</span></h3></div>
                            <button class="btn btn-primary px-5 py-3 rounded-pill fw-bold shadow-sm" onclick="guardarNota()">GUARDAR NOTA</button>
                        </div>
                    </div>
                </div>

                <div id="sec-historial" class="app-section d-none">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <table class="table table-hover mb-0">
                            <thead class="table-light"><tr><th class="px-4">Fecha</th><th>Cliente</th><th>Total</th><th class="text-end px-4">Acciones</th></tr></thead>
                            <tbody id="tablaHistorialBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="sec-clientes" class="app-section d-none">
                    <div class="d-flex justify-content-between mb-4">
                        <h4 class="fw-bold">Gestión de Clientes</h4>
                        <button class="btn btn-primary rounded-pill px-4" onclick="abrirModalCliente()">+ Nuevo Cliente</button>
                    </div>
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <table class="table mb-0">
                            <thead class="table-light"><tr><th class="px-4">Nombre</th><th>Teléfono</th><th class="text-end px-4">Acciones</th></tr></thead>
                            <tbody id="tablaClientesBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="sec-modelos" class="app-section d-none">
                    <div class="d-flex justify-content-between mb-4">
                        <h4 class="fw-bold">Catálogo de Modelos</h4>
                        <button class="btn btn-primary rounded-pill px-4" onclick="abrirModalModelo()">+ Nuevo Modelo</button>
                    </div>
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <table class="table mb-0">
                            <thead class="table-light"><tr><th class="px-4">Nombre Modelo</th><th class="text-end px-4">Acciones</th></tr></thead>
                            <tbody id="tablaModelosBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 pb-0"><h5 class="fw-bold" id="modalClienteTitulo">Nuevo Cliente</h5></div>
                <div class="modal-body">
                    <input type="hidden" id="editCliId">
                    <input type="text" id="nomCli" class="form-control mb-3" placeholder="Nombre Completo">
                    <input type="text" id="telCli" class="form-control" placeholder="Teléfono">
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-light" type="button" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" type="button" onclick="guardarCliente()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalModelo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 pb-0"><h5 class="fw-bold" id="modalModeloTitulo">Nuevo Modelo</h5></div>
                <div class="modal-body">
                    <input type="hidden" id="editModId">
                    <input type="text" id="nomMod" class="form-control" placeholder="Nombre del Modelo">
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-light" type="button" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" type="button" onclick="guardarModelo()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
