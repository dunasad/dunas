<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUNAS STUDIO - Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --d-blue: #1a237e; --d-red: #d32f2f; }
    body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; padding-bottom: 30px; }
    .nav-pills .nav-link.active { background: var(--d-blue) !important; }
    .nav-link { color: var(--d-blue); font-weight: 600; }
    .card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .btn-primary { background: var(--d-blue); border: none; }
    .btn-primary:hover { background: #0d145a; }
  </style>
</head>
<body>

  <div class="container mt-4">
    <div class="text-center mb-4"><h3 style="color: var(--d-blue); font-weight: 800;">DUNAS STUDIO</h3></div>

    <ul class="nav nav-pills nav-fill bg-white p-1 rounded-pill mb-4 shadow-sm" id="menu">
      <li class="nav-item"><button class="nav-link active rounded-pill" onclick="showTab('nota')">Nota</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" onclick="showTab('historial')">Historial</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" onclick="showTab('clientes')">Clientes</button></li>
    </ul>

    <div id="tab-nota" class="tab-view">
      <div class="card p-4 shadow-sm">
        <label class="small fw-bold text-muted mb-1">SELECCIONAR CLIENTE</label>
        <select id="selCliente" class="form-select mb-2" onchange="updateClientePreview()"></select>
        <div id="prevC" class="small text-muted mb-3 ms-2"></div>
        
        <label class="small fw-bold text-muted mb-1">TRABAJO / DESCRIPCIÓN</label>
        <input type="text" id="v_trabajo" placeholder="Ej: Fabricación de palas tejidas" class="form-control mb-4">

        <div id="items"></div>
        
        <button class="btn btn-outline-primary btn-sm w-100 mb-4" onclick="addItem()">+ Agregar Concepto</button>
        
        <div class="text-end mb-3">
            <span class="h4 fw-bold text-danger">Total: $<span id="totalDisplay">0.00</span></span>
        </div>
        
        <button class="btn btn-primary w-100 p-3 fw-bold shadow" id="btnGen" onclick="genNota()">GENERAR PDF Y GUARDAR</button>
      </div>
    </div>

    <div id="tab-historial" class="tab-view d-none">
        <div class="card p-3">
            <p class="text-center text-muted">Las notas se guardan directamente en tu Google Sheet y Drive.</p>
        </div>
    </div>

    <div id="tab-clientes" class="tab-view d-none">
        <div id="listaC" class="list-group"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx8zhRhT578V1D94Gba6mkVw2Sa370_wgbHUJmQrGPtQfpFDO9SaigQy5W4DCS_-yAUzQ/exec";
    let appD = { clientes: [], modelos: [] };

    window.onload = load;

    async function load() {
      try {
        const response = await fetch(API_URL + "?action=getData"); // Usando GET para traer datos
        appD = await response.json();
        renderAll();
      } catch (e) {
        console.error("Error cargando datos:", e);
      }
    }

    function renderAll() {
      const sel = document.getElementById('selCliente');
      sel.innerHTML = '<option value="">Selecciona Cliente...</option>' + 
        appD.clientes.map((c,i) => `<option value="${i}">${c.nombre}</option>`).join('');
      
      document.getElementById('listaC').innerHTML = appD.clientes.map(c => `
        <div class="list-group-item mb-2 border-0 shadow-sm rounded-3">
          <strong>${c.nombre}</strong><br><small class="text-muted">${c.destino} | ${c.tel}</small>
        </div>`).join('');

      if(document.getElementById('items').innerHTML === "") addItem();
    }

    function addItem() {
      const div = document.createElement('div');
      div.className = 'card p-3 mb-3 border-light bg-light';
      div.innerHTML = `
        <select class="form-select border-0 fw-bold mb-1 bg-transparent">
            ${appD.modelos.map(m => `<option>${m.nombre}</option>`).join('')}
        </select>
        <input type="text" class="form-control form-control-sm border-0 mb-2" placeholder="Detalles (ej: COLOR NEGRO)">
        <div class="row g-2">
            <div class="col-6"><input type="number" class="form-control" placeholder="Cant." onchange="calcTotal()"></div>
            <div class="col-6"><input type="number" class="form-control" placeholder="Precio" onchange="calcTotal()"></div>
        </div>`;
      document.getElementById('items').appendChild(div);
    }

    function calcTotal() {
        let t = 0;
        document.querySelectorAll('#items > div').forEach(d => {
            const q = parseFloat(d.querySelectorAll('input')[1].value) || 0;
            const p = parseFloat(d.querySelectorAll('input')[2].value) || 0;
            t += q * p;
        });
        document.getElementById('totalDisplay').innerText = t.toFixed(2);
    }

    async function genNota() {
      const ci = document.getElementById('selCliente').value;
      if(!ci) return alert("Selecciona un cliente");
      
      const btn = document.getElementById('btnGen');
      btn.disabled = true;
      btn.innerText = "GENERANDO...";

      const items = [];
      document.querySelectorAll('#items > div').forEach(d => {
        const q = parseFloat(d.querySelectorAll('input')[1].value);
        const p = parseFloat(d.querySelectorAll('input')[2].value);
        if(q && p) {
            items.push({
                modelo: d.querySelector('select').value, 
                desc: d.querySelectorAll('input')[0].value, 
                cantidad: q, 
                precio: p, 
                subtotal: q*p
            });
        }
      });

      const payload = {
        clienteNombre: appD.clientes[ci].nombre,
        clienteDestino: appD.clientes[ci].destino,
        clienteTel: appD.clientes[ci].tel,
        trabajoDesc: document.getElementById('v_trabajo').value || "Fabricación de palas tejidas",
        items: items,
        totalFinal: parseFloat(document.getElementById('totalDisplay').innerText)
      };

      try {
        // Enviar a Apps Script
        await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'createSale', payload: payload })
        });
        
        alert("¡Venta registrada con éxito! El PDF se guardó en tu Drive.");
        location.reload(); 
      } catch (e) {
        alert("Error al conectar con el servidor.");
        btn.disabled = false;
      }
    }

    function updateClientePreview() {
      const i = document.getElementById('selCliente').value;
      document.getElementById('prevC').innerText = i ? appD.clientes[i].destino + " | " + appD.clientes[i].tel : "";
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.add('d-none'));
      document.getElementById('tab-' + tab).classList.remove('d-none');
      document.querySelectorAll('#menu .nav-link').forEach(l => l.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
