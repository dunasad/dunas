<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO - Supabase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <header class="text-center mb-4">
            <h2 class="fw-bold text-primary">DUNAS STUDIO</h2>
        </header>

        <div class="card shadow-sm border-0 p-4">
            <div class="mb-3">
                <label class="form-label fw-bold">Cliente</label>
                <select id="selCliente" class="form-select"></select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Trabajo</label>
                <input type="text" id="trabajoDesc" class="form-control" value="Fabricación de palas tejidas">
            </div>

            <hr>
            <div id="itemsContainer">
                </div>
            
            <button class="btn btn-outline-secondary btn-sm mb-4" onclick="addItem()">+ Agregar Concepto</button>

            <div class="d-flex justify-content-between align-items-center">
                <h4 class="text-danger fw-bold">Total: $<span id="totalTxt">0.00</span></h4>
                <button class="btn btn-primary px-5 py-3 fw-bold" onclick="guardarNota()">GENERAR Y GUARDAR</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
