<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-red-700 text-white p-4 shadow-lg flex justify-between items-center">
        <span class="font-bold text-xl">DUNAS STUDIO</span>
        <div class="space-x-4">
            <button onclick="showTab('ventas')" class="hover:underline">Ventas</button>
            <button onclick="showTab('clientes')" class="hover:underline">Clientes</button>
            <button onclick="showTab('productos')" class="hover:underline">Modelos</button>
        </div>
    </nav>

    <div id="ventas" class="tab-content p-6 max-w-5xl mx-auto">
        <h2 class="text-2xl font-bold mb-4">Nueva Venta</h2>
        <div class="bg-white p-6 rounded shadow grid grid-cols-1 md:grid-cols-2 gap-4">
            <select id="v_cliente" class="border p-2 rounded"></select>
            <div class="flex space-x-2">
                <select id="v_prod" class="border p-2 rounded flex-1"></select>
                <button onclick="addItem()" class="bg-blue-600 text-white px-4 py-2 rounded">+ Añadir</button>
            </div>
            <div class="md:col-span-2 overflow-x-auto">
                <table class="w-full border mt-4">
                    <thead><tr class="bg-gray-100"><th class="p-2 border">Modelo</th><th class="p-2 border">Cant</th><th class="p-2 border">Total</th></tr></thead>
                    <tbody id="v_tabla"></tbody>
                </table>
                <div class="text-right text-xl font-bold mt-4 text-red-700">Total: $<span id="v_total">0</span></div>
                <button onclick="processSale()" id="btn_sale" class="w-full mt-4 bg-red-600 text-white py-3 rounded font-bold">GENERAR NOTA PDF</button>
            </div>
        </div>
    </div>

    <div id="clientes" class="tab-content hidden p-6 max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">Gestión de Clientes</h2>
            <button onclick="openModal('c')" class="bg-green-600 text-white px-4 py-2 rounded">+ Nuevo Cliente</button>
        </div>
        <table class="w-full bg-white shadow rounded overflow-hidden">
            <thead class="bg-gray-200"><tr><th class="p-3 text-left">Nombre</th><th class="p-3 text-left">Ciudad</th><th class="p-3 text-center">Acciones</th></tr></thead>
            <tbody id="t_clientes"></tbody>
        </table>
    </div>

    <div id="productos" class="tab-content hidden p-6 max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">Gestión de Modelos</h2>
            <button onclick="openModal('p')" class="bg-green-600 text-white px-4 py-2 rounded">+ Nuevo Modelo</button>
        </div>
        <table class="w-full bg-white shadow rounded overflow-hidden">
            <thead class="bg-gray-200"><tr><th class="p-3 text-left">Modelo</th><th class="p-3 text-left">Precio</th><th class="p-3 text-center">Acciones</th></tr></thead>
            <tbody id="t_productos"></tbody>
        </table>
    </div>

    <script>
        const API = "TU_URL_DE_APPSCRIPT_AQUÍ"; // REEMPLAZA ESTO
        let db = { clientes: [], productos: [] };
        let cart = [];

        async function load() {
            try {
                const res = await fetch(API);
                db = await res.json();
                renderUI();
            } catch (e) { console.error(e); alert("Error de conexión con la API"); }
        }

        function renderUI() {
            // Renderizar selects de venta
            document.getElementById('v_cliente').innerHTML = db.clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            document.getElementById('v_prod').innerHTML = db.productos.map((p,i) => `<option value="${i}">${p[0]} ($${p[1]})</option>`).join('');
            
            // Renderizar tablas de gestión
            document.getElementById('t_clientes').innerHTML = db.clientes.map(c => `
                <tr class="border-t">
                    <td class="p-3">${c[0]}</td><td class="p-3">${c[1]}</td>
                    <td class="p-3 text-center">
                        <button onclick="del('deleteCliente', ${c.index})" class="text-red-600 px-2">Eliminar</button>
                    </td>
                </tr>`).join('');
            
            document.getElementById('t_productos').innerHTML = db.productos.map(p => `
                <tr class="border-t">
                    <td class="p-3">${p[0]}</td><td class="p-3">$${p[1]}</td>
                    <td class="p-3 text-center">
                        <button onclick="del('deleteProducto', ${p.index})" class="text-red-600 px-2">Eliminar</button>
                    </td>
                </tr>`).join('');
        }

        function addItem() {
            const p = db.productos[document.getElementById('v_prod').value];
            cart.push({ modelo: p[0], precio: p[1], cantidad: 1, subtotal: p[1] });
            renderCart();
        }

        function renderCart() {
            let total = 0;
            document.getElementById('v_tabla').innerHTML = cart.map((it, i) => {
                total += parseFloat(it.subtotal);
                return `<tr><td class="p-2 border">${it.modelo}</td><td class="p-2 border">${it.cantidad}</td><td class="p-2 border">$${it.subtotal}</td></tr>`;
            }).join('');
            document.getElementById('v_total').innerText = total;
        }

        async function del(action, index) {
            if(!confirm("¿Seguro?")) return;
            await fetch(API, { method: 'POST', body: JSON.stringify({ action, payload: { index } }) });
            load();
        }

        async function processSale() {
            const btn = document.getElementById('btn_sale');
            btn.disabled = true; btn.innerText = "GENERANDO PDF...";
            const res = await fetch(API, { method: 'POST', body: JSON.stringify({ 
                action: 'createSale', 
                payload: { cliente: { nombre: document.getElementById('v_cliente').value }, items: cart, total: document.getElementById('v_total').innerText } 
            })});
            const data = await res.json();
            window.open(data.url, '_blank');
            cart = []; renderCart(); btn.disabled = false; btn.innerText = "GENERAR NOTA PDF";
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function openModal(type) {
            const val = prompt(`Ingrese los datos separados por coma (Nombre, Dato2):`);
            if(!val) return;
            const parts = val.split(',');
            const action = type === 'c' ? 'upsertCliente' : 'upsertProducto';
            const payload = type === 'c' ? { nombre: parts[0], ciudad: parts[1], tel: parts[2] } : { nombre: parts[0], precio: parts[1] };
            await fetch(API, { method: 'POST', body: JSON.stringify({ action, payload }) });
            load();
        }

        load();
    </script>
</body>
</html>
