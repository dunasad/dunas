<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUNAS – Notas de Venta</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #1B2B5E;
      --navy-deep:  #131f46;
      --navy-light: #243572;
      --red:        #C41E3A;
      --red-dark:   #a01830;
      --sky:        #e8edf8;
      --bg:         #f2f4fb;
      --white:      #ffffff;
      --border:     #d8dff0;
      --text:       #1B2B5E;
      --muted:      #7282a8;
      --success:    #15803d;
      --success-bg: #dcfce7;
      --danger:     #dc2626;
      --danger-bg:  #fee2e2;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── LOGIN VIEW ─────────────────────────── */
    #view-login {
      display: none;
      height: 100vh;
      align-items: center;
      justify-content: center;
      background: var(--navy);
    }
    #view-login.active { display: flex; }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-logo { height: 60px; margin-bottom: 20px; }

    /* ── APP WRAPPER ────────────────────────── */
    #app-content { display: none; }
    #app-content.active { display: block; }

    /* ── NAVBAR ─────────────────────────────── */
    .navbar {
      background: var(--navy);
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { height: 42px; margin-right: 14px; object-fit: contain; }
    .nav-brand { color: #fff; font-size: 1.05rem; font-weight: 800; letter-spacing: .03em; margin-right: 24px; }
    .nav-sep { width: 1px; height: 28px; background: rgba(255,255,255,.15); margin: 0 8px; }

    .nav-btn {
      background: transparent; border: none;
      color: rgba(255,255,255,.65);
      padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: .92rem; font-weight: 700;
      font-family: 'Nunito', sans-serif;
      transition: background .15s, color .15s;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    .nav-btn.active { background: rgba(255,255,255,.12); color: #fff; border-bottom: 3px solid var(--red); }

    .nav-spacer { flex: 1; }
    .nav-config, .nav-logout {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.75); padding: 7px 14px; border-radius: 8px;
      cursor: pointer; font-size: .88rem; font-weight: 700;
      font-family: 'Nunito', sans-serif; transition: all .15s;
      margin-left: 8px;
    }
    .nav-config:hover, .nav-logout:hover { background: rgba(255,255,255,.15); color: #fff; }
    .nav-logout:hover { background: var(--red); border-color: var(--red); }

    /* ── VIEWS ───────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    .main { padding: 32px 24px; max-width: 1080px; margin: 0 auto; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .page-title { font-size: 1.6rem; font-weight: 800; color: var(--navy); }

    /* ── CARDS ───────────────────────────────── */
    .card {
      background: var(--white); border-radius: 14px;
      box-shadow: 0 1px 6px rgba(27,43,94,.08);
      overflow: hidden;
    }
    .card-body { padding: 28px; }

    /* ── BUTTONS ─────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; border-radius: 9px; border: none;
      cursor: pointer; font-size: .9rem; font-weight: 700;
      font-family: 'Nunito', sans-serif; transition: all .15s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { background: var(--red-dark); }
    .btn-ghost {
      background: transparent; color: var(--navy);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover { background: var(--sky); }
    .btn-sm { padding: 6px 12px; font-size: .82rem; border-radius: 7px; }
    .btn-add-product {
      width: 100%; padding: 13px; border-radius: 10px;
      border: 2px dashed #9eb0d8; background: #f5f7ff;
      color: var(--navy-light); font-size: .95rem; font-weight: 700;
      font-family: 'Nunito', sans-serif; cursor: pointer;
      transition: all .2s;
    }
    .btn-add-product:hover { background: var(--sky); border-color: var(--navy-light); }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: .88rem; font-weight: 700;
      cursor: pointer; background: none; border: none;
      font-family: 'Nunito', sans-serif;
      margin-bottom: 18px; padding: 0;
      transition: color .15s;
    }
    .back-link:hover { color: var(--navy); }

    /* ── TABLE ───────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--navy); color: #fff;
      padding: 12px 18px; text-align: left;
      font-size: .8rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .06em;
    }
    tbody td {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      font-size: .9rem;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f7f9ff; }

    .empty-state {
      text-align: center; padding: 56px 20px; color: var(--muted);
    }
    .empty-state .icon { font-size: 2.8rem; margin-bottom: 10px; }
    .empty-state p { font-size: .95rem; }

    /* ── FORM ────────────────────────────────── */
    .form-group { margin-bottom: 16px; }
    label {
      display: block; font-size: .78rem; font-weight: 800;
      color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: .06em;
    }
    input, select, textarea {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: .93rem; font-family: 'Nunito', sans-serif;
      color: var(--text); background: #fff;
      transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--navy);
    }
    input[readonly] {
      background: var(--sky); font-weight: 800; color: var(--navy);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }

    /* ── ITEM ROW ────────────────────────────── */
    .item-row {
      background: #f7f9ff; border: 1.5px solid var(--border);
      border-radius: 12px; padding: 18px; margin-bottom: 12px;
      position: relative;
    }
    .item-row:hover { border-color: #9eb0d8; }
    .item-num {
      position: absolute; top: -10px; left: 16px;
      background: var(--navy); color: #fff;
      font-size: .72rem; font-weight: 900;
      padding: 2px 10px; border-radius: 999px;
      letter-spacing: .05em;
    }
    .btn-remove-item {
      position: absolute; top: 12px; right: 12px;
      background: var(--danger-bg); color: var(--danger);
      border: none; border-radius: 7px; padding: 4px 10px;
      cursor: pointer; font-size: .78rem; font-weight: 800;
      font-family: 'Nunito', sans-serif; transition: background .15s;
    }
    .btn-remove-item:hover { background: #fecaca; }

    /* ── TOTAL BAR ───────────────────────────── */
    .total-bar {
      background: var(--navy); color: #fff;
      border-radius: 12px; padding: 18px 22px;
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 20px; font-size: 1.1rem; font-weight: 900;
    }
    .total-bar span:last-child { font-size: 1.4rem; }

    .nota-actions {
      display: flex; gap: 10px; margin-top: 24px;
      padding-top: 22px; border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    /* ── FOLIO BADGE ─────────────────────────── */
    .folio-badge {
      display: inline-block; background: var(--sky); color: var(--navy);
      font-weight: 900; padding: 3px 12px; border-radius: 6px;
      font-size: .88rem; letter-spacing: .04em;
    }

    /* ── MODAL ───────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(10,20,60,.55); z-index: 500;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 18px; padding: 32px;
      width: 100%; max-width: 500px;
      box-shadow: 0 24px 64px rgba(10,20,60,.22);
      animation: pop .2s ease;
    }
    .modal-lg { max-width: 680px; }
    @keyframes pop {
      from { transform: scale(.95); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal-title { font-size: 1.2rem; font-weight: 900; color: var(--navy); margin-bottom: 24px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

    /* ── TOAST ───────────────────────────────── */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      padding: 14px 20px; border-radius: 12px;
      font-weight: 800; font-size: .9rem;
      box-shadow: 0 6px 24px rgba(0,0,0,.2);
      z-index: 9999; display: none;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .toast-ok  { background: var(--success-bg); color: var(--success); }
    .toast-err { background: var(--danger-bg);  color: var(--danger); }

    /* ── LOADER ──────────────────────────────── */
    .loader-wrap {
      display: none; position: fixed; inset: 0;
      background: rgba(255,255,255,.75); z-index: 9000;
      align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    .loader-wrap.on { display: flex; }
    .spinner {
      width: 42px; height: 42px;
      border: 4px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: .88rem; font-weight: 700; color: var(--muted); }

    /* ── SQL BOX ─────────────────────────────── */
    .sql-box {
      background: #0f172a; color: #7dd3fc;
      border-radius: 10px; padding: 16px; font-size: .78rem;
      font-family: 'Courier New', monospace; max-height: 240px;
      overflow-y: auto; white-space: pre; line-height: 1.6;
      margin: 12px 0;
    }
    .info-box {
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 10px; padding: 14px 16px;
      font-size: .83rem; color: #1e40af; line-height: 1.6;
      margin-bottom: 16px;
    }

    /* ─────────────────────────────────────────
       PRINT VIEW
    ───────────────────────────────────────── */
    #print-view { display: none; }

    @media print {
      body > *:not(#print-view) { display: none !important; }
      #print-view {
        display: block !important;
        font-family: Arial, sans-serif;
        font-size: 11pt;
        color: #000;
      }
      .no-print { display: none !important; }
      @page { margin: 12mm; }
    }

    .pv-wrap {
      max-width: 720px; margin: 0 auto;
      border: 1.5px solid #222; padding: 22px 26px;
    }
    .pv-top {
      display: flex; justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #222; padding-bottom: 14px; margin-bottom: 14px;
    }
    .pv-logo { height: 68px; object-fit: contain; }
    .pv-title-block { text-align: right; }
    .pv-title { font-size: 22pt; font-weight: 700; }
    .pv-meta { font-size: 9.5pt; margin-top: 4px; line-height: 1.7; }
    .pv-meta strong { font-weight: 700; }
    .pv-client-table { width: 100%; margin-bottom: 12px; }
    .pv-client-table td { padding: 2px 0; font-size: 10pt; }
    .pv-client-table .lbl { font-weight: 700; width: 75px; }
    .pv-work-header {
      background: #2c4a7c; color: #fff;
      text-align: center; padding: 6px 10px;
      font-size: 9.5pt; font-weight: 700;
    }
    .pv-work-sub {
      background: #d8edda; text-align: center;
      padding: 4px 10px; font-size: 9pt;
      margin-bottom: 12px;
    }
    .pv-table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
    .pv-table th {
      background: #2c4a7c; color: #fff;
      padding: 7px 10px; text-align: left; font-size: 9pt;
    }
    .pv-table td { padding: 10px; border: 1px solid #ccc; font-size: 9.5pt; vertical-align: top; }
    .pv-table .tc { text-align: center; }
    .pv-table .tr { text-align: right; }
    .pv-table .w-qty { width: 72px; }
    .pv-table .w-price { width: 130px; }
    .pv-table .w-total { width: 110px; }
    .pv-total-row td {
      font-weight: 700; border: none;
      border-top: 2px solid #333; text-align: right; padding: 8px 10px;
    }
    .pv-address { text-align: center; font-size: 8.5pt; color: #555; padding-top: 8px; border-top: 1px solid #ccc; }
    .pv-thanks { text-align: center; font-weight: 700; margin-top: 18px; font-size: 10pt; }
  </style>
</head>
<body>

<div id="view-login">
  <div class="login-card">
    <img src="logo.png" class="login-logo" alt="DUNAS" onerror="this.style.display='none'">
    <h2 style="color: var(--navy); margin-bottom: 24px; font-weight: 900;">Iniciar Sesión</h2>
    <div class="form-group" style="text-align: left;">
      <label>Correo Electrónico</label>
      <input type="email" id="login-email" placeholder="tu@email.com">
    </div>
    <div class="form-group" style="text-align: left;">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="handleLogin()">Entrar al Sistema</button>
  </div>
</div>

<div id="app-content">
  <nav class="navbar">
    <img src="logo.png" class="nav-logo" alt="DUNAS" onerror="this.style.display='none'">
    <span class="nav-brand">Notas de Venta</span>
    <div class="nav-sep"></div>
    <button class="nav-btn active" id="nav-notas"    onclick="gotoView('notas')">📋 Notas</button>
    <button class="nav-btn"        id="nav-clientes" onclick="gotoView('clientes')">👥 Clientes</button>
    <button class="nav-btn"        id="nav-modelos"  onclick="gotoView('modelos')">📦 Modelos</button>
    <div class="nav-spacer"></div>
    <button class="nav-config" onclick="abrirConfig()" title="Configuración">⚙️</button>
    <button class="nav-logout" onclick="handleLogout()" title="Cerrar Sesión">Sair 🚪</button>
  </nav>

  <div class="main">
    <div class="view active" id="view-notas">
      <div class="page-header">
        <h1 class="page-title">📋 Notas de Venta</h1>
        <button class="btn btn-primary" onclick="abrirNuevaNota()">＋ Nueva Nota</button>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Folio</th><th>No. Pedido</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tb-notas"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="view" id="view-nota-form">
      <button class="back-link" onclick="gotoView('notas')">← Regresar a Notas</button>
      <div class="page-header"><h1 class="page-title" id="nota-form-titulo">Nueva Nota</h1></div>
      <div class="card card-body">
        <div class="grid-3" style="margin-bottom:16px">
          <div class="form-group"><label>Folio / N.º de Venta *</label><input type="text" id="nf-folio" placeholder="RAD04"></div>
          <div class="form-group"><label>No. Pedido</label><input type="text" id="nf-pedido" placeholder="1061"></div>
          <div class="form-group"><label>Fecha *</label><input type="date" id="nf-fecha"></div>
        </div>
        <div class="grid-2" style="margin-bottom:16px">
          <div class="form-group"><label>Cliente *</label><select id="nf-cliente"></select></div>
          <div class="form-group"><label>Trabajo</label><input type="text" id="nf-trabajo"></div>
        </div>
        <div id="items-wrap"></div>
        <button class="btn-add-product" onclick="agregarItem()">＋ Agregar producto</button>
        <div class="total-bar"><span>TOTAL</span><span id="nf-total-display">$ 0.00</span></div>
        <div class="nota-actions">
          <button class="btn btn-primary" id="btn-guardar" onclick="guardarNota()">💾 Guardar Nota</button>
          <button class="btn btn-red" id="btn-imprimir" onclick="imprimirNota()" style="display:none">🖨️ Imprimir</button>
          <button class="btn btn-ghost" onclick="gotoView('notas')">✕ Cancelar</button>
        </div>
      </div>
    </div>

    <div class="view" id="view-clientes">
      <div class="page-header">
        <h1 class="page-title">👥 Clientes</h1>
        <button class="btn btn-primary" onclick="abrirModalCliente()">＋ Nuevo Cliente</button>
      </div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Nombre</th><th>Ciudad</th><th>Teléfono</th><th>Acciones</th></tr></thead><tbody id="tb-clientes"></tbody></table></div></div>
    </div>

    <div class="view" id="view-modelos">
      <div class="page-header">
        <h1 class="page-title">📦 Modelos</h1>
        <button class="btn btn-primary" onclick="abrirModalModelo()">＋ Nuevo Modelo</button>
      </div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Modelo</th><th>Acciones</th></tr></thead><tbody id="tb-modelos"></tbody></table></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-cliente"><div class="modal"><div class="modal-title" id="modal-cliente-titulo">Nuevo Cliente</div><input type="hidden" id="mc-id"><div class="form-group"><label>Nombre *</label><input type="text" id="mc-nombre"></div><div class="form-group"><label>Ciudad</label><input type="text" id="mc-ciudad"></div><div class="form-group"><label>Teléfono</label><input type="text" id="mc-tel"></div><div class="modal-footer"><button class="btn btn-ghost" onclick="cerrarModal('modal-cliente')">Cancelar</button><button class="btn btn-primary" onclick="guardarCliente()">Guardar</button></div></div></div>
<div class="modal-overlay" id="modal-modelo"><div class="modal"><div class="modal-title" id="modal-modelo-titulo">Nuevo Modelo</div><input type="hidden" id="mm-id"><div class="form-group"><label>Nombre del Modelo *</label><input type="text" id="mm-nombre"></div><div class="modal-footer"><button class="btn btn-ghost" onclick="cerrarModal('modal-modelo')">Cancelar</button><button class="btn btn-primary" onclick="guardarModelo()">Guardar</button></div></div></div>
<div class="modal-overlay" id="modal-config"><div class="modal modal-lg"><div class="modal-title">⚙️ Configuración</div><div class="form-group"><label>Supabase URL</label><input type="text" id="cfg-url"></div><div class="form-group"><label
