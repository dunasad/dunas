<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO - Panel</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0d6efd; --sidebar-width: 250px; }
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; overflow-x: hidden; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa; z-index: 10001; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 380px; padding: 2.5rem; border-radius: 1.5rem; background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .wrapper { display: flex; width: 100%; align-items: stretch; }
        #sidebar { min-width: var(--sidebar-width); max-width: var(--sidebar-width); background: #212529; color: #fff; transition: all 0.3s; min-height: 100vh; }
        #sidebar.active { margin-left: calc(-1 * var(--sidebar-width)); }
        #sidebar .sidebar-header { padding: 20px; text-align: center; background: #1a1d20; }
        #sidebar ul li a { padding: 15px 20px; display: block; color: #adb5bd; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        #sidebar ul li.active > a, #sidebar ul li a:hover { color: #fff; background: var(--primary); }
        #content { width: 100%; padding: 0; min-height: 100vh; }
        .app-section { padding: 20px; }
        .d-none { display: none !important; }
        .logo-img { width: 100px; filter: brightness(0) invert(1); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card text-center">
            <img src="logo.png" alt="DUNAS" width="120" class="mb-4 mx-auto d-block">
            <h5 class="fw-bold mb-4">Acceso DUNAS</h5>
            <input type="text" id="userInput" class="form-control mb-3 text-center rounded-3 py-2" placeholder="Usuario">
            <input type="password" id="passInput" class="form-control mb-4 text-center rounded-3 py-2" placeholder="Contraseña">
            <button class="btn btn-primary w-100 py-2 fw-bold rounded-pill" id="btnLogin" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <div class="wrapper d-none" id="main-app">
        <nav id="sidebar">
            <div class="sidebar-header">
                <img src="logo.png" alt="DUNAS" class="logo-img">
            </div>
            <ul class="list-unstyled components">
                <li id="menu-notas" class="active" onclick="showSection('notas')">
                    <a href="#"><i class="bi bi-file-earmark-plus"></i> <span>Notas</span></a>
                </li>
                <li id="menu-historial" onclick="showSection('historial')">
                    <a href="#"><i class="bi bi-clock-history"></i> <span>Historial</span></a>
                </li>
                <li id="menu-clientes" onclick="showSection('clientes')">
                    <a href="#"><i class="bi bi-people"></i> <span>Clientes</span></a>
                </li>
                <li id="menu-modelos" onclick="showSection('modelos')">
                    <a href="#"><i class="bi bi-box-seam"></i> <span>Modelos</span></a>
                </li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-light bg-white shadow-sm px-4 py-3 mb-4">
                <button type="button" id="sidebarCollapse" class="btn btn-outline-primary border-0"><i class="bi bi-list fs-4"></i></button>
                <h5 class="mb-0 fw-bold text-secondary" id="sectionTitle">Crear Nota</h5>
            </nav>

            <div class="container-fluid px-4">
                <div id="sec-notas" class="app-section">
                    <div class="card shadow-sm border-0 p-4 rounded-4">
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">SELECCIONAR CLIENTE</label>
                            <select id="selCliente" class="form-select border-0 bg-light py-2 px-3"></select>
                        </div>
                        <div id="itemsContainer"></div>
                        <button class="btn btn-outline-primary btn-sm w-100 rounded-3 mb-4 py-2 border-dashed" onclick="addItem()">
                            <i class="bi bi-plus-circle me-1"></i> Agregar Concepto
                        </button>
                        <div class="d-flex justify-content-between align-items-center mt-4 border-top pt-4">
                            <div>
                                <span class="text-muted small d-block">Monto Total</span>
                                <h3 class="text-danger fw-bold mb-0">$<span id="totalTxt">0.00</span></h3>
                            </div>
                            <button class="btn btn-primary px-5 py-3 fw-bold rounded-pill shadow" onclick="guardarNota()">
                                <i class="bi bi-save me-2"></i> GUARDAR VENTA
                            </button>
                        </div>
                    </div>
                </div>

                <div id="sec-historial" class="app-section d-none">
                    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="border-0 px-4">Fecha</th>
                                        <th class="border-0">Cliente</th>
                                        <th class="border-0">Total</th>
                                        <th class="border-0 text-end px-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaHistorialBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="sec-clientes" class="app-section d-none">
                     <div class="d-flex justify-content-between mb-3"><h4>Clientes</h4><button class="btn btn-primary rounded-pill" onclick="abrirModalCliente()">Nuevo Cliente</button></div>
                     <table class="table table-white shadow-sm rounded-4"><tbody id="tablaClientesBody"></tbody></table>
                </div>
                <div id="sec-modelos" class="app-section d-none">
                     <div class="d-flex justify-content-between mb-3"><h4>Modelos</h4><button class="btn btn-primary rounded-pill" onclick="abrirModalModelo()">Nuevo Modelo</button></div>
                     <table class="table table-white shadow-sm rounded-4"><tbody id="tablaModelosBody"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="liveToast" class="toast align-items-center text-white bg-dark border-0 rounded-3" role="alert"><div class="d-flex"><div class="toast-body" id="toastMsg"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
