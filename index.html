<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-[#800000] text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <div class="font-black text-xl tracking-tighter">DUNAS STUDIO</div>
        <div class="flex gap-4 font-bold text-sm">
            <button onclick="showTab('ventas')">VENTAS</button>
            <button onclick="showTab('clientes')">CLIENTES</button>
            <button onclick="showTab('modelos')">MODELOS</button>
        </div>
    </nav>

    <main id="ventas" class="tab-content p-4 max-w-5xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <h2 class="text-xl font-bold mb-6 text-slate-800">Nueva Nota de Venta</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Cliente</label>
                    <select id="v_cliente" class="w-full border-2 p-3 rounded-xl focus:border-red-500 outline-none"></select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Trabajo / Descripción General</label>
                    <input type="text" id="v_trabajo" placeholder="Ej: Fabricación de palas tejidas" class="w-full border-2 p-3 rounded-xl">
                </div>
            </div>

            <div class="mb-6">
                <label class="text-xs font-bold text-slate-400 uppercase">Modelo base</label>
                <div class="flex gap-2">
                    <select id="v_modelo_sel" class="flex-1 border-2 p-3 rounded-xl focus:border-red-500 outline-none"></select>
                    <button onclick="addItem()" class="bg-blue-600 text-white px-6 rounded-xl font-bold hover:bg-blue-700">+ Añadir</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full border-separate border-spacing-y-2">
                    <thead>
                        <tr class="text-slate-400 text-xs uppercase text-left">
                            <th class="px-4">Modelo / Detalle</th>
                            <th class="px-4 w-24 text-center">Cant.</th>
                            <th class="px-4 w-32 text-right">Precio</th>
                            <th class="px-4 w-32 text-right">Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="v_tabla"></tbody>
                </table>
            </div>

            <div class="flex flex-col items-end mt-8 border-t pt-6">
                <div class="text-4xl font-black text-red-900 mb-6">Total: $<span id="v_total">0.00</span></div>
                <button onclick="processSale()" id="btn_sale" class="bg-red-800 text-white px-12 py-4 rounded-2xl font-black text-lg hover:scale-105 transition shadow-xl w-full md:w-auto uppercase">
                    GENERAR PDF Y GUARDAR
                </button>
            </div>
        </div>
    </main>

    <section id="clientes" class="tab-content hidden p-4 max-w-5xl mx-auto">
        <h2 class="text-2xl font-bold mb-4">Administración de Clientes</h2>
        <div id="list_clientes" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <section id="modelos" class="tab-content hidden p-4 max-w-5xl mx-auto">
        <h2 class="text-2xl font-bold mb-4">Catálogo de Modelos</h2>
        <div id="list_modelos" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <script>
        // URL REAL DE TU APP SCRIPT
        const API = "https://script.google.com/macros/s/AKfycbx8zhRhT578V1D94Gba6mkVw2Sa370_wgbHUJmQrGPtQfpFDO9SaigQy5W4DCS_-yAUzQ/exec";
        
        let db = { clientes: [], modelos: [] };
        let cart = [];

        async function load() {
            try {
                const res = await fetch(API);
                db = await res.json();
                renderUI();
            } catch (err) {
                console.error("Error cargando datos:", err);
            }
        }

        function renderUI() {
            const selC = document.getElementById('v_cliente');
            const selM = document.getElementById('v_modelo_sel');

            // Corregimos carga de nombres (evita undefined)
            selC.innerHTML = db.clientes.map((c, i) => `<option value="${i}">${c.nombre || 'Sin Nombre'}</option>`).join('');
            selM.innerHTML = db.modelos.map((m, i) => `<option value="${i}">${m.nombre || 'Modelo'}</option>`).join('');
            
            // Render de listas de gestión
            document.getElementById('list_clientes').innerHTML = db.clientes.map(c => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                    <div><p class="font-bold text-red-900">${c.nombre}</p><p class="text-[10px] text-slate-400">${c.destino || ''}</p></div>
                </div>`).join('');
            
            document.getElementById('list_modelos').innerHTML = db.modelos.map(m => `
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <p class="font-bold text-slate-700">${m.nombre}</p>
                </div>`).join('');
        }

        function addItem() {
            const sel = document.getElementById('v_modelo_sel');
            const m = db.modelos[sel.value];
            if(!m) return;
            cart.push({ modelo: m.nombre, descripcion: '', precio: 0, cantidad: 1, subtotal: 0 });
            renderCart();
        }

        function updateCart(i, field, val) {
            cart[i][field] = (field === 'descripcion') ? val : parseFloat(val || 0);
            cart[i].subtotal = cart[i].cantidad * cart[i].precio;
            renderCart();
        }

        function renderCart() {
            let total = 0;
            document.getElementById('v_tabla').innerHTML = cart.map((it, i) => {
                total += it.subtotal;
                return `
                <tr class="bg-white shadow-sm border">
                    <td class="p-4 rounded-l-xl">
                        <div class="font-bold text-slate-800">${it.modelo}</div>
                        <input type="text" placeholder="Añadir detalle..." value="${it.descripcion}" onchange="updateCart(${i}, 'descripcion', this.value)" class="text-xs w-full text-blue-600 outline-none italic">
                    </td>
                    <td class="p-4 text-center">
                        <input type="number" value="${it.cantidad}" onchange="updateCart(${i}, 'cantidad', this.value)" class="w-16 text-center border rounded font-bold">
                    </td>
                    <td class="p-4 text-right">
                        <input type="number" value="${it.precio}" onchange="updateCart(${i}, 'precio', this.value)" class="w-24 text-right border rounded font-bold">
                    </td>
                    <td class="p-4 text-right font-black text-slate-700">$${it.subtotal.toFixed(2)}</td>
                    <td class="p-4 rounded-r-xl text-center">
                        <button onclick="cart.splice(${i},1); renderCart();" class="text-red-400 hover:text-red-600">✕</button>
                    </td>
                </tr>`;
            }).join('');
            document.getElementById('v_total').innerText = total.toLocaleString('en-US', {minimumFractionDigits: 2});
        }

        async function processSale() {
            const btn = document.getElementById('btn_sale');
            const clienteIdx = document.getElementById('v_cliente').value;
            const clienteObj = db.clientes[clienteIdx];

            if(!clienteObj || cart.length === 0) return alert("Selecciona un cliente y productos.");

            const prefix = clienteObj.nombre.substring(0,3).toUpperCase();
            const nVenta = prefix + "01"; 

            const payload = {
                cliente: clienteObj.nombre,
                destino: clienteObj.destino,
                tel: clienteObj.tel,
                trabajoDesc: document.getElementById('v_trabajo').value,
                nVenta: nVenta,
                items: cart,
                total: document.getElementById('v_total').innerText
            };

            btn.disabled = true; btn.innerText = "GENERANDO PDF...";
            
            try {
                const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'createSale', payload }) });
                const data = await res.json();
                
                if(data.status === "success") {
                    // Descarga directa para móviles
                    window.location.href = data.url; 
                    alert("¡Nota guardada! Se descargará el archivo.");
                    cart = []; 
                    document.getElementById('v_trabajo').value = "";
                    renderCart();
                } else {
                    alert("Error: " + data.message);
                }
            } catch (e) {
                alert("Error de conexión con el servidor.");
            } finally {
                btn.disabled = false; btn.innerText = "GENERAR PDF Y GUARDAR";
            }
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        load();
    </script>
</body>
</html>
