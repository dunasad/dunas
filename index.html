<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUNAS STUDIO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --d-blue: #1a237e; --d-red: #d32f2f; }
    body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; padding-bottom: 30px; }
    .nav-pills .nav-link.active { background: var(--d-blue) !important; }
    .card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .btn-primary { background: var(--d-blue); border: none; }
    .btn-edit-soft { color: var(--d-blue); background: #eef; border: none; padding: 5px 10px; border-radius: 8px; }
    .btn-danger-soft { color: var(--d-red); background: #fee; border: none; padding: 5px 10px; border-radius: 8px; }
    .nav-link { color: var(--d-blue); font-weight: 600; }
  </style>
</head>
<body>

  <div class="container mt-4">
    <div class="text-center mb-4">
        <h3 style="color: var(--d-blue); font-weight: 800;">DUNAS STUDIO</h3>
    </div>

    <ul class="nav nav-pills nav-fill bg-white p-1 rounded-pill mb-4 shadow-sm" id="pills-tab">
      <li class="nav-item"><button class="nav-link active rounded-pill" onclick="showTab('nota')"><i class="bi bi-plus-circle"></i> Nota</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" onclick="showTab('clientes')"><i class="bi bi-people"></i> Clientes</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" onclick="showTab('modelos')"><i class="bi bi-box-seam"></i> Modelos</button></li>
    </ul>

    <div id="tab-nota" class="tab-view">
      <div class="card p-4">
        <div class="mb-3">
          <label class="form-label small fw-bold">CLIENTE</label>
          <select id="selCliente" class="form-select" onchange="updatePrev()"></select>
          <div id="prevC" class="small text-muted mt-1 ms-1"></div>
        </div>
        
        <div class="mb-4">
          <label class="form-label small fw-bold">TRABAJO</label>
          <input type="text" id="v_trabajo" value="Fabricación de palas tejidas" class="form-control">
        </div>

        <div id="itemsContainer"></div>
        
        <button class="btn btn-outline-primary btn-sm w-100 mb-4" onclick="addItem()">+ Agregar Concepto</button>
        
        <div class="text-end mb-4">
            <span class="h4 fw-bold text-danger">Total: $<span id="totalDisplay">0.00</span></span>
        </div>
        
        <button class="btn btn-primary w-100 p-3 fw-bold shadow" id="btnGen" onclick="genNota()">GENERAR PDF Y GUARDAR</button>
      </div>
    </div>

    <div id="tab-clientes" class="tab-view d-none">
        <div class="card p-3">
            <div class="d-flex justify-content-between mb-3 align-items-center">
                <h5 class="fw-bold m-0">Mis Clientes</h5>
                <button class="btn btn-primary btn-sm rounded-pill" onclick="alert('Usa el sistema en Google para añadir nuevos')">+ Nuevo</button>
            </div>
            <div id="listaClientes" class="list-group list-group-flush"></div>
        </div>
    </div>

    <div id="tab-modelos" class="tab-view d-none">
        <div class="card p-3">
            <h5 class="fw-bold mb-3">Catálogo de Modelos</h5>
            <div id="listaModelos" class="list-group list-group-flush"></div>
        </div>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbx8zhRhT578V1D94Gba6mkVw2Sa370_wgbHUJmQrGPtQfpFDO9SaigQy5W4DCS_-yAUzQ/exec";
    let appD = { clientes: [], modelos: [] };

    window.onload = load;

    async function load() {
      try {
        // Petición corregida para traer los datos
        const res = await fetch(API + "?action=getData");
        appD = await res.json();
        render();
      } catch (e) {
        console.error("Error:", e);
      }
    }

    function render() {
      // Cargar Clientes en el Selector
      const sel = document.getElementById('selCliente');
      sel.innerHTML = '<option value="">Selecciona...</option>' + 
        appD.clientes.map((c,i) => `<option value="${i}">${c.nombre}</option>`).join('');
      
      // Lista de Clientes (Diseño original)
      document.getElementById('listaClientes').innerHTML = appD.clientes.map(c => `
        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <div><div class="fw-bold text-dark">${c.nombre}</div><small class="text-muted">${c.destino}</small></div>
          <div class="d-flex gap-2">
            <button class="btn-edit-soft"><i class="bi bi-pencil"></i></button>
            <button class="btn-danger-soft"><i class="bi bi-trash"></i></button>
          </div>
        </div>`).join('');

      // Lista de Modelos (Diseño original)
      document.getElementById('listaModelos').innerHTML = appD.modelos.map(m => `
        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <span class="fw-bold">${m.nombre}</span>
          <button class="btn-danger-soft"><i class="bi bi-trash"></i></button>
        </div>`).join('');

      if(document.getElementById('itemsContainer').innerHTML === "") addItem();
    }

    function addItem() {
      const div = document.createElement('div');
      div.className = 'card p-3 mb-3 border-light bg-light position-relative';
      div.innerHTML = `
        <button class="btn-close position-absolute top-0 end-0 m-2" style="font-size: 10px" onclick="this.parentElement.remove(); calc();"></button>
        <select class="form-select border-0 fw-bold mb-1 bg-transparent p-0 shadow-none">
            ${appD.modelos.map(m => `<option>${m.nombre}</option>`).join('')}
        </select>
        <input type="text" class="form-control form-control-sm border-0 mb-2 p-0 shadow-none text-primary" placeholder="Color / Detalle">
        <div class="row g-2">
            <div class="col-6"><input type="number" class="form-control form-control-sm" placeholder="Cant." onchange="calc()"></div>
            <div class="col-6"><input type="number" class="form-control form-control-sm" placeholder="Precio" onchange="calc()"></div>
        </div>`;
      document.getElementById('itemsContainer').appendChild(div);
    }

    function calc() {
        let t = 0;
        document.querySelectorAll('#itemsContainer > div').forEach(d => {
            const inputs = d.querySelectorAll('input');
            const q = parseFloat(inputs[1].value) || 0;
            const p = parseFloat(inputs[2].value) || 0;
            t += q * p;
        });
        document.getElementById('totalDisplay').innerText = t.toFixed(2);
    }

    async function genNota() {
      const idx = document.getElementById('selCliente').value;
      if(!idx) return alert("Selecciona cliente");
      
      const btn = document.getElementById('btnGen');
      btn.disabled = true; btn.innerText = "PROCESANDO...";

      const items = [];
      document.querySelectorAll('#itemsContainer > div').forEach(d => {
        const sel = d.querySelector('select').value;
        const inputs = d.querySelectorAll('input');
        if(inputs[1].value && inputs[2].value) {
            items.push({
                modelo: sel, 
                desc: inputs[0].value, 
                cantidad: parseFloat(inputs[1].value), 
                precio: parseFloat(inputs[2].value), 
                subtotal: inputs[1].value * inputs[2].value
            });
        }
      });

      const payload = {
        clienteNombre: appD.clientes[idx].nombre,
        clienteDestino: appD.clientes[idx].destino,
        clienteTel: appD.clientes[idx].tel,
        trabajoDesc: document.getElementById('v_trabajo').value,
        items: items,
        totalFinal: parseFloat(document.getElementById('totalDisplay').innerText)
      };

      try {
        await fetch(API, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'createSale', payload })
        });
        alert("Nota enviada con éxito.");
        location.reload();
      } catch (e) {
        alert("Error al enviar.");
        btn.disabled = false;
      }
    }

    function updatePrev() {
      const i = document.getElementById('selCliente').value;
      document.getElementById('prevC').innerText = i ? `${appD.clientes[i].destino} | ${appD.clientes[i].tel}` : "";
    }

    function showTab(id) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.add('d-none'));
      document.getElementById('tab-' + id).classList.remove('d-none');
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
