<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <nav class="bg-[#800000] text-white p-4 flex justify-between items-center shadow-lg">
        <div class="font-bold tracking-widest uppercase">DUNAS STUDIO</div>
        <div class="space-x-6 text-sm font-bold">
            <button onclick="showTab('ventas')">Ventas</button>
            <button onclick="showTab('clientes')">Clientes</button>
            <button onclick="showTab('modelos')">Modelos</button>
        </div>
    </nav>

    <div id="ventas" class="tab-content p-4 max-w-5xl mx-auto">
        <div class="bg-white p-8 rounded-xl shadow-xl">
            <h2 class="text-2xl font-bold mb-6 text-slate-800">Nueva Nota de Venta</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                <select id="v_cliente" class="border-2 p-3 rounded-lg focus:border-red-500 outline-none"></select>
                <input type="text" id="v_trabajo" placeholder="Trabajo (ej: Fabricación de palas)" class="border-2 p-3 rounded-lg">
            </div>

            <div class="flex gap-2 mb-6">
                <select id="v_modelo_sel" class="flex-1 border-2 p-3 rounded-lg"></select>
                <button onclick="addItem()" class="bg-blue-600 text-white px-8 rounded-lg font-bold hover:bg-blue-700">+ Agregar</button>
            </div>

            <table class="w-full text-left">
                <thead class="text-slate-400 text-xs uppercase border-b">
                    <tr>
                        <th class="py-3">Descripción</th>
                        <th class="text-center">Cant.</th>
                        <th class="text-right">Precio</th>
                        <th class="text-right">Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="v_tabla" class="divide-y"></tbody>
            </table>

            <div class="flex flex-col items-end mt-8 border-t pt-6">
                <div class="text-red-600 font-bold text-3xl mb-4">Total: $<span id="v_total">0.00</span></div>
                <button onclick="processSale()" id="btn_sale" class="bg-red-600 text-white px-10 py-4 rounded-xl font-bold text-lg hover:scale-105 transition shadow-lg w-full md:w-auto uppercase">GENERAR PDF Y GUARDAR</button>
            </div>
        </div>
    </div>

    <div id="clientes" class="tab-content hidden p-8 text-center text-gray-500">Administración de Clientes (Cargando...)</div>
    <div id="modelos" class="tab-content hidden p-8 text-center text-gray-500">Administración de Modelos (Cargando...)</div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx8zhRhT578V1D94Gba6mkVw2Sa370_wgbHUJmQrGPtQfpFDO9SaigQy5W4DCS_-yAUzQ/exec";
        let db = { clientes: [], modelos: [] };
        let cart = [];

        async function load() {
            try {
                const res = await fetch(API);
                db = await res.json();
                renderUI();
            } catch (e) {
                console.log("Error al cargar:", e);
            }
        }

        function renderUI() {
            const selC = document.getElementById('v_cliente');
            const selM = document.getElementById('v_modelo_sel');
            
            // Usamos nombres de propiedades genéricos para evitar errores de mapeo
            selC.innerHTML = db.clientes.map((c, i) => `<option value="${i}">${c.nombre || c.Nombre || 'S/N'}</option>`).join('');
            selM.innerHTML = db.modelos.map((m, i) => `<option value="${i}">${m.nombre || m.Nombre || m.Modelo || 'Modelo'}</option>`).join('');
        }

        function addItem() {
            const m = db.modelos[document.getElementById('v_modelo_sel').value];
            cart.push({ 
                modelo: m.nombre || m.Nombre || m.Modelo, 
                descripcion: '', 
                precio: 0, 
                cantidad: 1, 
                subtotal: 0 
            });
            renderCart();
        }

        function renderCart() {
            let total = 0;
            document.getElementById('v_tabla').innerHTML = cart.map((it, i) => {
                total += it.subtotal;
                return `<tr class="text-sm">
                    <td class="py-4">
                        <b>${it.modelo}</b><br>
                        <input type="text" placeholder="Detalle..." onchange="cart[${i}].descripcion=this.value" class="text-xs w-full text-blue-500 outline-none bg-transparent">
                    </td>
                    <td class="text-center"><input type="number" value="${it.cantidad}" onchange="updateCart(${i}, 'cantidad', this.value)" class="w-16 border rounded text-center"></td>
                    <td class="text-right font-bold">$ <input type="number" value="${it.precio}" onchange="updateCart(${i}, 'precio', this.value)" class="w-20 border rounded text-right"></td>
                    <td class="text-right font-bold">$ ${it.subtotal.toFixed(2)}</td>
                    <td class="text-center"><button onclick="cart.splice(${i},1); renderCart();" class="text-red-400">✕</button></td>
                </tr>`;
            }).join('');
            document.getElementById('v_total').innerText = total.toFixed(2);
        }

        function updateCart(i, field, val) {
            cart[i][field] = parseFloat(val || 0);
            cart[i].subtotal = cart[i].cantidad * cart[i].precio;
            renderCart();
        }

        async function processSale() {
            const btn = document.getElementById('btn_sale');
            const cliente = db.clientes[document.getElementById('v_cliente').value];
            
            const payload = {
                cliente: cliente.nombre || cliente.Nombre,
                destino: cliente.destino || cliente.Destino || "",
                tel: cliente.tel || cliente.Teléfono || cliente.Telefono || "",
                trabajoDesc: document.getElementById('v_trabajo').value,
                items: cart,
                total: document.getElementById('v_total').innerText
            };

            btn.disabled = true; btn.innerText = "PROCESANDO...";

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    mode: 'no-cors', // Mantiene la compatibilidad con Google Scripts
                    body: JSON.stringify({ action: 'createSale', payload })
                });

                // Como usamos no-cors no podemos leer la respuesta, 
                // pero enviamos una señal de éxito al usuario.
                alert("Venta enviada correctamente. Revisa tu carpeta de Drive para ver el PDF.");
                cart = []; renderCart();
            } catch (err) {
                alert("Error al procesar la venta.");
            } finally {
                btn.disabled = false; btn.innerText = "GENERAR PDF Y GUARDAR";
            }
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        load();
    </script>
</body>
</html>
