<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <nav id="sidebar" class="active">
            <div class="sidebar-header">
                <img src="logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">DUNAS</span>
            </div>

            <ul class="list-unstyled components">
                <li class="active" onclick="showSection('notas')">
                    <a href="#"><i class="bi bi-file-earmark-plus"></i> <span>Notas</span></a>
                </li>
                <li onclick="showSection('historial')">
                    <a href="#"><i class="bi bi-clock-history"></i> <span>Historial</span></a>
                </li>
                <li onclick="showSection('clientes')">
                    <a href="#"><i class="bi bi-people"></i> <span>Clientes</span></a>
                </li>
                <li onclick="showSection('modelos')">
                    <a href="#"><i class="bi bi-box-seam"></i> <span>Modelos</span></a>
                </li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-primary">
                        <i class="bi bi-list"></i>
                    </button>
                    <h5 class="ms-3 mb-0" id="sectionTitle">Crear Nota</h5>
                </div>
            </nav>

            <div class="container-fluid">
                <div id="sec-notas" class="app-section">
                    <div class="card shadow-sm border-0 p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Cliente</label>
                            <select id="selCliente" class="form-select"></select>
                        </div>
                        <div id="itemsContainer"></div>
                        <button class="btn btn-outline-primary btn-sm w-100 mb-4" onclick="addItem()">+ Agregar Concepto</button>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <h4 class="text-danger fw-bold">Total: $<span id="totalTxt">0.00</span></h4>
                            <button class="btn btn-success px-4 py-2" onclick="guardarNota()">GUARDAR NOTA</button>
                        </div>
                    </div>
                </div>

                <div id="sec-historial" class="app-section d-none">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr><th>Folio</th><th>Cliente</th><th>Total</th><th>Acción</th></tr></thead>
                            <tbody id="listaHistorial"></tbody>
                        </table>
                    </div>
                </div>

                <div id="sec-clientes" class="app-section d-none">
                    <h3>Registro de Clientes</h3>
                    </div>
                <div id="sec-modelos" class="app-section d-none">
                    <h3>Registro de Modelos</h3>
                    </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
