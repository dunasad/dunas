<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUNAS STUDIO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --d-blue: #1a237e; --d-red: #d32f2f; }
    body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
    .nav-pills .nav-link.active { background: var(--d-blue) !important; }
    .card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .btn-edit-soft { color: var(--d-blue); background: #eef; border: none; padding: 5px 10px; border-radius: 8px; }
    .btn-danger-soft { color: var(--d-red); background: #fee; border: none; padding: 5px 10px; border-radius: 8px; }
    .nav-link { color: var(--d-blue); font-weight: 600; }
  </style>
</head>
<body>

  <div class="container mt-4">
    <div class="text-center mb-4"><h3 style="color: var(--d-blue); font-weight: 800;">DUNAS STUDIO</h3></div>

    <ul class="nav nav-pills nav-fill bg-white p-1 rounded-pill mb-4 shadow-sm">
      <li class="nav-item"><button class="nav-link active rounded-pill" onclick="showTab('nota')">Nota</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" onclick="showTab('historial')">Notas</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" onclick="showTab('clientes')">Clientes</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" onclick="showTab('modelos')">Modelos</button></li>
    </ul>

    <div id="tab-nota" class="tab-view">
      <div class="card p-4">
        <select id="selCliente" class="form-select mb-3" onchange="updatePrev()"></select>
        <input type="text" id="v_trabajo" value="Fabricación de palas tejidas" class="form-control mb-4">
        <div id="itemsContainer"></div>
        <button class="btn btn-outline-primary btn-sm w-100 mb-4" onclick="addItem()">+ Agregar Concepto</button>
        <div class="text-end mb-4"><span class="h4 fw-bold text-danger">Total: $<span id="totalDisplay">0.00</span></span></div>
        <button class="btn btn-primary w-100 p-3 fw-bold shadow" id="btnGen" onclick="genNota()">GENERAR Y ABRIR PDF</button>
      </div>
    </div>

    <div id="tab-historial" class="tab-view d-none">
        <div class="card p-3"><div id="listaVentas" class="list-group list-group-flush"></div></div>
    </div>

    <div id="tab-clientes" class="tab-view d-none">
        <div class="card p-3"><div id="listaClientes" class="list-group list-group-flush"></div></div>
    </div>

    <div id="tab-modelos" class="tab-view d-none">
        <div class="card p-3"><div id="listaModelos" class="list-group list-group-flush"></div></div>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbx8zhRhT578V1D94Gba6mkVw2Sa370_wgbHUJmQrGPtQfpFDO9SaigQy5W4DCS_-yAUzQ/exec";
    let appD = { clientes: [], modelos: [], ventas: [] };

    window.onload = load;

    async function load() {
      try {
        const res = await fetch(API + "?action=getData");
        appD = await res.json();
        render();
      } catch (e) { alert("Error de conexión. Verifica la publicación del Script."); }
    }

    function render() {
      document.getElementById('selCliente').innerHTML = '<option value="">Selecciona Cliente...</option>' + 
        appD.clientes.map((c,i) => `<option value="${i}">${c.nombre}</option>`).join('');
      
      document.getElementById('listaVentas').innerHTML = appD.ventas.map(v => `
        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <div><div class="fw-bold">${v.ventaNo}</div><small>${v.cliente} - $${v.total}</small></div>
          <a href="${v.url}" target="_blank" class="btn-edit-soft text-decoration-none">Ver PDF</a>
        </div>`).join('');

      document.getElementById('listaClientes').innerHTML = appD.clientes.map(c => `
        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <div><div class="fw-bold">${c.nombre}</div><small>${c.destino}</small></div>
          <div class="d-flex gap-2">
            <button class="btn-danger-soft" onclick="borrar('Clientes', ${c.row})"><i class="bi bi-trash"></i></button>
          </div>
        </div>`).join('');

      document.getElementById('listaModelos').innerHTML = appD.modelos.map(m => `
        <div class="list-group-item d-flex justify-content-between align-items-center px-0">
          <span class="fw-bold">${m.nombre}</span>
          <button class="btn-danger-soft" onclick="borrar('Modelos', ${m.row})"><i class="bi bi-trash"></i></button>
        </div>`).join('');

      if(!document.getElementById('itemsContainer').innerHTML) addItem();
    }

    async function borrar(tabla, fila) {
        if(!confirm("¿Seguro que quieres eliminar este registro?")) return;
        await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: 'deleteRow', table: tabla, row: fila}) });
        alert("Solicitud de eliminación enviada.");
        load();
    }

    // ... (Mantener funciones addItem, calc y updatePrev del código anterior)
    
    function showTab(id) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.add('d-none'));
      document.getElementById('tab-' + id).classList.remove('d-none');
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
