<!DOCTYPE html>
<html>
<head>
  <title>Notas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div id="sidebar" class="sidebar">
    <img src="logo.png" class="logo">

    <button onclick="mostrarSeccion('notas')">Notas</button>
    <button onclick="mostrarSeccion('historial')">Historial</button>

    <p>Altas</p>
    <button onclick="mostrarSeccion('clientes')">Clientes</button>
    <button onclick="mostrarSeccion('modelos')">Modelos</button>
  </div>

  <div class="contenido">

    <button class="menu" onclick="toggleSidebar()">☰</button>

    <!-- NOTAS -->
    <div id="notas" class="seccion">
  <h2>Crear Nota</h2>

  <div class="form-grid">

    <div>
      <label>Cliente</label>
      <select id="clienteSelect"></select>
    </div>

    <div>
      <label>Fecha</label>
      <input id="fecha" type="date">
    </div>

    <div>
      <label>Modelo</label>
      <select id="modeloSelect"></select>
    </div>

    <div>
      <label>Descripción</label>
      <input id="descripcion" placeholder="Color, talla, etc">
    </div>

    <div>
      <label>Cantidad</label>
      <input id="cantidad" type="number">
    </div>

    <div>
      <label>Precio</label>
      <input id="precio" type="number">
    </div>

  </div>

  <h3>Total: $<span id="total">0</span></h3>

  <button class="btn" onclick="guardarNota()">Guardar Nota</button>
</div>

    <!-- HISTORIAL -->
    <div id="historial" class="seccion" style="display:none;">
      <h2>Historial</h2>
      <button onclick="cargarNotas()">Cargar</button>
      <div id="listaNotas"></div>
    </div>

    <!-- CLIENTES -->
    <div id="clientes" class="seccion" style="display:none;">
      <h2>Clientes</h2>

      <input id="nombreCliente" placeholder="Nombre">
      <input id="ciudadCliente" placeholder="Ciudad">
      <input id="telCliente" placeholder="Teléfono">

      <button onclick="guardarCliente()">Guardar</button>

      <div id="listaClientes"></div>
    </div>

    <!-- MODELOS -->
    <div id="modelos" class="seccion" style="display:none;">
      <h2>Modelos</h2>

      <input id="nombreModelo" placeholder="Nombre del modelo">
      <button onclick="guardarModelo()">Guardar</button>

      <div id="listaModelos"></div>
    </div>

  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
