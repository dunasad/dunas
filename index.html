<!DOCTYPE html>
<html>
<head>
  <title>Notas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div id="sidebar" class="sidebar">
    <img src="logo.png" class="logo">

    <button onclick="mostrarSeccion('notas')">Notas</button>
    <button onclick="mostrarSeccion('historial')">Historial</button>

    <p>Altas</p>
    <button onclick="mostrarSeccion('clientes')">Clientes</button>
    <button onclick="mostrarSeccion('modelos')">Modelos</button>
  </div>

  <!-- CONTENIDO -->
  <div class="contenido">

    <!-- BOTON MENU -->
    <button class="menu" onclick="toggleSidebar()">☰</button>

    <!-- NOTAS -->
    <div id="notas" class="seccion">
      <h2>Crear Nota</h2>

      <select id="clienteSelect"></select><br><br>

      <input id="fecha" type="date"><br><br>

      <input id="folio" placeholder="Folio"><br><br>
      <input id="numero_nota" placeholder="No. Nota"><br><br>

      <select id="modeloSelect"></select><br><br>

      <input id="descripcion" placeholder="Descripción"><br><br>

      <input id="cantidad" type="number" placeholder="Cantidad">
      <input id="precio" type="number" placeholder="Precio"><br><br>

      <p>Total: $<span id="total">0</span></p>

      <button onclick="guardarNota()">Guardar Nota</button>
    </div>

    <!-- HISTORIAL -->
    <div id="historial" class="seccion" style="display:none;">
      <h2>Historial</h2>
      <button onclick="cargarNotas()">Cargar</button>
      <div id="listaNotas"></div>
    </div>

    <!-- CLIENTES -->
    <div id="clientes" class="seccion" style="display:none;">
      <h2>Clientes</h2>

      <input id="nombreCliente" placeholder="Nombre">
      <input id="ciudadCliente" placeholder="Ciudad">
      <input id="telCliente" placeholder="Teléfono">

      <button onclick="guardarCliente()">Guardar</button>

      <div id="listaClientes"></div>
    </div>

    <!-- MODELOS -->
    <div id="modelos" class="seccion" style="display:none;">
      <h2>Modelos</h2>

      <input id="nombreModelo" placeholder="Nombre">
      <button onclick="guardarModelo()">Guardar</button>

      <div id="listaModelos"></div>
    </div>

  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
