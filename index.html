<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUNAS STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-red-900 text-white p-4 flex justify-between items-center shadow-xl">
        <h1 class="font-bold">DUNAS STUDIO</h1>
        <div class="space-x-2">
            <button onclick="showTab('ventas')" class="px-3">Ventas</button>
            <button onclick="showTab('clientes')" class="px-3">Clientes</button>
            <button onclick="showTab('modelos')" class="px-3">Modelos</button>
        </div>
    </nav>

    <div id="ventas" class="tab-content p-4 max-w-6xl mx-auto">
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold mb-4 border-b">Nueva Nota de Venta</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <select id="v_cliente" class="border-2 p-3 rounded-lg"></select>
                <div class="flex gap-2">
                    <select id="v_modelo" class="flex-1 border-2 p-3 rounded-lg"></select>
                    <button onclick="addItem()" class="bg-blue-600 text-white px-6 rounded-lg font-bold">+ Agregar</button>
                </div>
            </div>
            <table class="w-full border-collapse bg-white">
                <thead><tr class="bg-gray-200">
                    <th class="p-2 border">Modelo</th>
                    <th class="p-2 border">Descripción</th>
                    <th class="p-2 border w-20">Cant.</th>
                    <th class="p-2 border w-32">Precio</th>
                    <th class="p-2 border">Subtotal</th>
                    <th class="p-2 border"></th>
                </tr></thead>
                <tbody id="v_tabla"></tbody>
            </table>
            <div class="text-right mt-6">
                <div class="text-2xl font-bold text-red-800 mb-4">Total: $<span id="v_total">0.00</span></div>
                <button onclick="processSale()" id="btn_sale" class="bg-red-700 text-white px-8 py-3 rounded-lg font-bold w-full md:w-auto">GENERAR PDF Y GUARDAR VENTA</button>
            </div>
        </div>
    </div>

    <div id="clientes" class="tab-content hidden p-4 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-xl">Mis Clientes</h2>
            <button onclick="openModal('c')" class="bg-green-600 text-white p-2 rounded">+ Nuevo Cliente</button>
        </div>
        <div id="list_clientes" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>

    <div id="modelos" class="tab-content hidden p-4 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-xl">Catálogo de Modelos</h2>
            <button onclick="openModal('m')" class="bg-green-600 text-white p-2 rounded">+ Nuevo Modelo</button>
        </div>
        <div id="list_modelos" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx8zhRhT578V1D94Gba6mkVw2Sa370_wgbHUJmQrGPtQfpFDO9SaigQy5W4DCS_-yAUzQ/exec";
        let db = { clientes: [], modelos: [] };
        let cart = [];

        async function load() {
            const res = await fetch(API);
            db = await res.json();
            renderUI();
        }

        function renderUI() {
            document.getElementById('v_cliente').innerHTML = db.clientes.map(c => `<option value="${c.nombre}">${c.nombre} (${c.dato2})</option>`).join('');
            document.getElementById('v_modelo').innerHTML = db.modelos.map((m,i) => `<option value="${i}">${m.nombre} - $${m.dato2}</option>`).join('');
            
            document.getElementById('list_clientes').innerHTML = db.clientes.map(c => `
                <div class="bg-white p-4 rounded shadow flex justify-between items-center border-l-4 border-red-700">
                    <div><p class="font-bold">${c.nombre}</p><p class="text-xs text-gray-400">${c.dato2}</p></div>
                    <button onclick="del('Clientes', ${c.index})" class="text-red-500">X</button>
                </div>`).join('');
            
            document.getElementById('list_modelos').innerHTML = db.modelos.map(m => `
                <div class="bg-white p-4 rounded shadow flex justify-between items-center border-l-4 border-blue-700">
                    <div><p class="font-bold">${m.nombre}</p><p class="text-xs text-gray-400">${m.dato3 || 'Sin desc.'}</p></div>
                    <button onclick="del('Modelos', ${m.index})" class="text-red-500">X</button>
                </div>`).join('');
        }

        function addItem() {
            const m = db.modelos[document.getElementById('v_modelo').value];
            cart.push({ modelo: m.nombre, descripcion: m.dato3 || '', precio: parseFloat(m.dato2), cantidad: 1, subtotal: parseFloat(m.dato2) });
            renderCart();
        }

        function updateCart(i, field, val) {
            cart[i][field] = (field === 'descripcion') ? val : parseFloat(val);
            cart[i].subtotal = (cart[i].cantidad || 0) * (cart[i].precio || 0);
            renderCart();
        }

        function renderCart() {
            let total = 0;
            document.getElementById('v_tabla').innerHTML = cart.map((it, i) => {
                total += it.subtotal;
                return `<tr>
                    <td class="p-2 border font-bold">${it.modelo}</td>
                    <td class="p-2 border"><input type="text" value="${it.descripcion}" onchange="updateCart(${i}, 'descripcion', this.value)" class="w-full border rounded p-1"></td>
                    <td class="p-2 border"><input type="number" value="${it.cantidad}" onchange="updateCart(${i}, 'cantidad', this.value)" class="w-full border rounded p-1 text-center"></td>
                    <td class="p-2 border"><input type="number" value="${it.precio}" onchange="updateCart(${i}, 'precio', this.value)" class="w-full border rounded p-1 text-right"></td>
                    <td class="p-2 border text-right font-bold">$${it.subtotal.toFixed(2)}</td>
                    <td class="p-2 border text-center"><button onclick="cart.splice(${i},1); renderCart();" class="text-red-500">X</button></td>
                </tr>`;
            }).join('');
            document.getElementById('v_total').innerText = total.toFixed(2);
        }

        async function processSale() {
            const btn = document.getElementById('btn_sale');
            btn.disabled = true; btn.innerText = "PROCESANDO...";
            const payload = { cliente: document.getElementById('v_cliente').value, items: cart, total: document.getElementById('v_total').innerText };
            const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'createSale', payload }) });
            const data = await res.json();
            if(data.status === "success") { window.open(data.url, '_blank'); cart = []; renderCart(); }
            btn.disabled = false; btn.innerText = "GENERAR PDF Y GUARDAR VENTA";
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function del(sheet, index) {
            if(!confirm("¿Eliminar?")) return;
            await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'delete', payload: { sheet, index } }) });
            load();
        }

        async function openModal(type) {
            if(type === 'c') {
                const nombre = prompt("Nombre:"); const ciudad = prompt("Ciudad:"); const tel = prompt("Teléfono:");
                if(nombre) await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'upsertCliente', payload: { nombre, ciudad, tel } }) });
            } else {
                const modelo = prompt("Nombre del Modelo:"); const precio = prompt("Precio:"); const descripcion = prompt("Descripción:");
                if(modelo) await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'upsertModelo', payload: { modelo, precio, descripcion } }) });
            }
            load();
        }

        load();
    </script>
</body>
</html>
